<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lukáš Hála · Photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Libre+Franklin:wght@400;500&display=swap" rel="stylesheet">
<style id="lhcss"></style>
<style>
/* Editorial portfolio after emeisdeubel.com: centered masthead, comma category nav, bottom-aligned rows of photos in size steps */
:root{--bg:#fff;--fg:#000;--muted:#7a7a7a;--serif:'Instrument Serif','Canela',Georgia,serif;--sans:'Libre Franklin','GT America',system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#fff;--fg:#000}}
:root[data-theme="dark"]{--bg:#fff;--fg:#000}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:400 14.4px/1.8 var(--sans);letter-spacing:.04em;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.u{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;text-decoration-color:rgba(0,0,0,.35);transition:text-decoration-color .2s}
.u:hover,.u.on{text-decoration-color:#000}
.top{text-align:center;padding:24px 20px 0}
.top b{font-weight:400;text-transform:uppercase}
.mast{text-align:center;padding:56px 20px 0}
.mast h1{font:400 clamp(40px,5vw,52px)/1.2 var(--serif);letter-spacing:-.01em}
.mast em{display:block;font:italic 400 clamp(25px,3vw,31px)/1.2 var(--serif);letter-spacing:-.01em}
.cats{text-align:center;padding:30px 20px 0}
.cats a{white-space:nowrap}
main{padding:clamp(56px,9vw,110px) 0 40px;transition:opacity .45s ease}
main.out{opacity:0}
footer{text-align:center;padding:40px 20px 48px;color:var(--muted);font-size:12.5px}
footer a{color:var(--fg)}
/* viewer: just the photo on white and a close button */
.vw{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;
  padding:calc(64px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(48px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  cursor:zoom-out;animation:vwin .35s ease both}
@keyframes vwin{from{opacity:0}to{opacity:1}}
.vw img{display:block;max-width:min(1400px,100%);max-height:100%;width:auto;height:auto;object-fit:contain;animation:vwimg .5s cubic-bezier(.2,.7,.15,1) both}
@keyframes vwimg{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
.vw-x{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));width:44px;height:44px;display:grid;place-items:center;color:var(--fg);opacity:.7;transition:opacity .2s;cursor:pointer}
.vw-x:hover{opacity:1}
.vw-x svg{width:20px;height:20px}
body.viewing{overflow:hidden}
.credit{display:inline-block;margin-top:14px;color:var(--muted)!important;text-decoration:none}
.credit:hover{color:var(--fg)!important}
@media (prefers-reduced-motion: reduce){.vw,.vw img{animation:none}}
/* info */
.info{width:min(640px,calc(100vw - 40px));margin:0 auto;text-align:center}
.info p.bio{font:400 clamp(22px,2.6vw,28px)/1.35 var(--serif);letter-spacing:0}
.info h2{font:400 12.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:56px 0 16px}
.info ul{list-style:none;padding:0}
.info li{line-height:2}
@media (max-width:700px){
  .mast{padding-top:40px}
  .top{font-size:13px;padding-top:18px}
  .vw-stage{cursor:default}
}
</style>
</head>
<body>
<header class="mast"><h1><a href="#/">Lukáš Hála</a></h1><em>Imaginis Production</em></header>
<nav class="cats" id="cats"></nav>
<main id="main"></main>
<footer id="foot"></footer>
<script src="/data.js"></script>
<script src="/site.js"></script>
<script>
(function(){
  document.getElementById('lhcss').textContent=LH.CSS;
  var D=LH.D, BASE='/img/', PREVIEW=/[?&]preview=1/.test(location.search);
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var site=load();
  function load(){
    return LH.defaultSite();
  }
  function catName(c){if(c==='overview')return 'Overview';for(var i=0;i<D.cats.length;i++)if(D.cats[i][0]===c)return D.cats[i][1];return c;}
  function route(){var h=(location.hash||'#/').slice(2).split('/');return {cat:h[0]||'overview',photo:h[1]||null};}
  function seq(cat){var a=[];(site.layouts[cat]||[]).forEach(function(r){r.items.forEach(function(it){a.push(it.id);});});return a;}
  function nav(cur){
    document.getElementById('cats').innerHTML=[['overview','Overview']].concat(D.cats).map(function(c){
      return '<a class="u'+(c[0]===cur?' on':'')+'" href="#/'+(c[0]==='overview'?'':c[0])+'">'+c[1]+'</a>';
    }).join(', ')+', <a class="u'+(cur==='info'?' on':'')+'" href="#/info">Work with me</a>';
  }
  function foot(){
    var i=site.info;
    document.getElementById('foot').innerHTML='<a class="u" href="mailto:'+i.email+'">'+i.email+'</a>, <a class="u" href="https://instagram.com/'+i.instagram+'" target="_blank" rel="noopener">Instagram</a><br><a class="credit" href="https://vojtechsvoboda.cz" target="_blank" rel="noopener">Website by vojtechsvoboda.cz</a>';
  }
  function grid(cat){
    if(cat!=='overview'&&!site.layouts[cat])LH.syncLayout(site,cat);
    return LH.rowsHtml(site,site.layouts[cat]||[],{base:BASE,lazy:!PREVIEW,href:function(it){return '#/'+cat+'/'+it.id;}});
  }
  function viewer(cat,id){
    var p=LH.projectOf(site,id),alt=p?(p.title+' — '+p.client):'';
    return '<section class="vw" id="stage"><img src="'+LH.src(site,id,BASE)+'" alt="'+alt.replace(/"/g,'')+'"><a class="vw-x" href="#/'+(cat==='overview'?'':cat)+'" aria-label="Close"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3 3l14 14M17 3L3 17"/></svg></a></section>';
  }
  function info(){
    var i=site.info;
    return '<section class="info"><p class="bio">'+i.bio+'</p><h2>Selected clients</h2><ul>'+i.clients.map(function(c){return '<li>'+c+'</li>';}).join('')+
      '</ul><h2>Contact</h2><ul><li><a class="u" href="mailto:'+i.email+'">'+i.email+'</a></li><li><a class="u" href="https://instagram.com/'+i.instagram+'" target="_blank" rel="noopener">@'+i.instagram+'</a></li></ul></section>';
  }
  var main=document.getElementById('main'),last=null,ov=null,keepY=0;
  /* the photo opens as an overlay above the page, so closing it keeps the grid and the scroll position */
  function showPhoto(r){
    if(!ov){ov=document.createElement('div');document.body.appendChild(ov);}
    if(!ov.innerHTML)keepY=window.scrollY;
    ov.innerHTML=viewer(r.cat,r.photo);document.body.classList.add('viewing');
    var back='#/'+(r.cat==='overview'?'':r.cat);
    ov.firstChild.onclick=function(e){e.preventDefault();location.hash=back;};
    document.onkeydown=function(e){if(e.key==='Escape')location.hash=back;};
  }
  function hidePhoto(){var had=!!(ov&&ov.innerHTML);if(ov){ov.innerHTML='';}document.body.classList.remove('viewing');document.onkeydown=null;if(had)window.scrollTo(0,keepY);}
  function render(fade){
    var r=route(),page=r.cat;
    nav(r.cat); foot();
    if(r.photo){ if(last!==page){main.innerHTML=grid(page);last=page;} showPhoto(r); return; }
    var wasPhoto=!!(ov&&ov.innerHTML);hidePhoto();
    if(wasPhoto&&last===page)return;
    var html=r.cat==='info'?info():grid(r.cat);
    var go=function(){main.innerHTML=html;main.classList.remove('out');if(!PREVIEW&&last!==null)window.scrollTo(0,0);last=page;};
    if(fade&&!reduce&&!PREVIEW&&last!==page){main.classList.add('out');setTimeout(go,260);}else go();
  }
  addEventListener('hashchange',function(){render(true);});
  /* published content from the server; the built-in default shows until it arrives (or if nothing is published yet) */
  /* live preview from the admin: it posts the whole draft site plus which page to show */
  addEventListener('message',function(e){
    var d=e.data;if(!d||d.type!=='lh-site')return;
    site=d.site; if(d.route!=null&&location.hash!=='#/'+d.route){history.replaceState(null,'','#/'+d.route);}
    last=null;render(false);
  });
  /* published content from the server; the built-in default is used if nothing is published yet */
  if(PREVIEW){render(false);parent.postMessage({type:'lh-ready'},'*');}
  /* ?demo=1: show what the try-out admin published in this browser (nothing is sent to the server) */
  else if(/[?&]demo=1/.test(location.search)&&(function(){try{var dl=JSON.parse(localStorage.getItem('lhdemo-pub')||'null');if(dl&&dl.v===1){site=dl;return true;}}catch(e){}return false;})()){render(false);}
  else{
    var done=false,first=function(){if(!done){done=true;render(false);}};
    setTimeout(first,1500);
    fetch('/api/site',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(s){if(s&&s.v===1)site=s;else{try{var l=JSON.parse(localStorage.getItem('lh-pub')||'null');if(l&&l.v===1)site=l;}catch(e){}}}).catch(function(){}).then(function(){if(done){last=null;render(false);}else first();});
  }
})();
</script>
</body>
</html>
